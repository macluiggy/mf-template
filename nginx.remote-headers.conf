# Headers every response of a remote needs. Included by nginx.conf in the
# server block and in each location (see the note there).

# The host (another origin) fetches remoteEntry.json and every chunk with
# import(): CORS is mandatory for a remote. Narrow the origin per environment
# if the reverse proxy does not already do it.
add_header 'Access-Control-Allow-Origin' '*' always;
add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept' always;

# Basic hardening that never breaks a cross-origin module load.
add_header X-Content-Type-Options 'nosniff' always;
add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
