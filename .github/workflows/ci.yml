name: CI

# Generic CI of this template: install, lint, format check, tests and build.
# No secrets, no deploy: the NEOCORE GitLab pipeline (scaffold/) is the preset
# that builds images and deploys to the fleet.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, format, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .bun-version and .node-version are the single source of truth: no
      # version is hardcoded here.
      - name: Read the tool versions
        id: versions
        run: |
          echo "bun=$(tr -d '[:space:]' < .bun-version)" >> "$GITHUB_OUTPUT"
          echo "node=$(tr -d '[:space:]' < .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.versions.outputs.bun }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}

      # No lockfile is versioned: `bun install` regenerates it.
      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
