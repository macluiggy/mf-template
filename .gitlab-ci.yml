# Minimal pipeline: install -> lint -> test -> build -> docker.
#
# Build-time variables come from CI/CD variables (protect/mask them as needed):
#   API_URL, SECRET_KEY, NODE_ENV.
# The image is pushed to this project's container registry ($CI_REGISTRY_IMAGE)
# on the default branch only. Add deploy stages per project.

stages:
  - install
  - lint
  - test
  - build
  - docker

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid duplicate branch + merge request pipelines.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

variables:
  # Keep bun's download cache inside the project so `cache:` can capture it.
  BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.bun-cache"
  BUN_IMAGE: "oven/bun:1.4.2-slim"

.bun_cache: &bun_cache
  key:
    files:
      - bun.lock
  paths:
    - .bun-cache/
    - node_modules/

.bun_job:
  image: $BUN_IMAGE
  cache:
    - <<: *bun_cache
      policy: pull
  before_script:
    - bun install --frozen-lockfile --ignore-scripts

install:
  extends: .bun_job
  stage: install
  # Only job that writes the cache.
  cache:
    - <<: *bun_cache
      policy: pull-push
  script:
    - echo "bun $(bun -v) / node $(bun -e 'console.log(process.version)')"

lint:
  extends: .bun_job
  stage: lint
  script:
    - bun run check
  needs: [install]

test:
  extends: .bun_job
  stage: test
  script:
    - bun run test
  needs: [install]

build:
  extends: .bun_job
  stage: build
  script:
    # The file is never printed nor published as an artifact.
    - |
      cat > .env << EOF
      NODE_ENV=${NODE_ENV:-PROD}
      API_URL=$API_URL
      SECRET_KEY=$SECRET_KEY
      EOF
    - bun run build
    - test -f dist/browser/index.html
  artifacts:
    paths:
      - dist/
    expire_in: 2 hours
  needs: [lint, test]

docker:
  stage: docker
  image: docker:25.0.3
  services:
    - docker:25.0.3-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      set -eu
      IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      # DIST_STAGE=prebuilt reuses dist/ from the build job instead of rebuilding.
      docker build --target runtime --build-arg DIST_STAGE=prebuilt -t "$IMAGE" -t "$CI_REGISTRY_IMAGE:latest" .
      docker push "$IMAGE"
      docker push "$CI_REGISTRY_IMAGE:latest"
  needs:
    - job: build
      artifacts: true
