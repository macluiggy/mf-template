error_log /var/log/nginx/error.log warn;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  sendfile on;

  # Container health probe (Dockerfile HEALTHCHECK, compose.yml).
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # index.html must never be cached: it points to the hashed bundles of the
  # current deploy.
  location = /index.html {
    add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
    expires off;
  }

  # Hashed bundles (outputHashing: all) are immutable: cache them for a year.
  location ~* \.(?:js|mjs|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
    add_header Cache-Control 'public, max-age=31536000, immutable' always;
    try_files $uri =404;
  }

  # SPA fallback: unknown paths are client-side routes served by index.html.
  location / {
    add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
