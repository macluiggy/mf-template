error_log /var/log/nginx/error.log warn;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  sendfile on;

  # The host (another origin) fetches remoteEntry.json and every chunk with
  # import(): CORS is mandatory for a remote. Narrow the origin per
  # environment if the reverse proxy does not already do it.
  add_header 'Access-Control-Allow-Origin' '*' always;
  add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
  add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept' always;

  # Never cache: remoteEntry.json must always point to the current chunks
  # after a deploy (same policy as frontcore).
  add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
  expires off;
  if_modified_since off;
  etag off;

  # Container health probe (Dockerfile HEALTHCHECK, compose.yml).
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location / {
    if ($request_method = 'OPTIONS') {
      return 204;
    }
    # SPA fallback for standalone navigation; real files are served as-is.
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
