error_log /var/log/nginx/error.log warn;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  sendfile on;

  # Text assets compress well (JS/CSS/JSON ~70%). The host downloads every
  # chunk of this remote on navigation, so this is the cheapest win.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

  # nginx drops every server-level add_header in a location that declares its
  # own, so the common headers live in one snippet included in each location.
  # Never add an add_header to a location without the include.
  include /etc/nginx/conf.d/remote-headers.inc;

  # Container health probe (Dockerfile HEALTHCHECK, compose.yml).
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Content-hashed build output (esbuild `name-HASH.js`, Native Federation
  # shared bundles `name.HASH.js`, `styles-HASH.css`): a new build gets new
  # names, so a cached copy can never be stale. Cache it for a year.
  location ~* \.(?:js|css)$ {
    include /etc/nginx/conf.d/remote-headers.inc;
    add_header Cache-Control 'public, max-age=31536000, immutable' always;
    try_files $uri =404;
  }

  # Everything else (remoteEntry.json, importmap.json, index.html, assets
  # without a hash) must never be cached: remoteEntry.json has to point to the
  # current chunks right after a deploy (same policy as frontcore).
  location / {
    include /etc/nginx/conf.d/remote-headers.inc;
    add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0' always;
    expires off;
    if_modified_since off;
    etag off;

    if ($request_method = 'OPTIONS') {
      return 204;
    }
    # SPA fallback for standalone navigation; real files are served as-is.
    try_files $uri $uri/ /index.html;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
