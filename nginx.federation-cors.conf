# CORS headers: only a federated remote needs them. The host (another origin)
# fetches remoteEntry.json and every chunk with import(), so CORS is mandatory
# for a remote; a plain SPA does not ship this file (the image adds it only
# with `--build-arg FEDERATION=true`).
#
# Narrow the origin per environment if the reverse proxy does not already do it.

add_header 'Access-Control-Allow-Origin' '*' always;
add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept' always;
